name: Public Alpha Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-alpha-v0.1.0-alpha.1
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Require an approved repository license
        shell: bash
        run: |
          if [ ! -s LICENSE ]; then
            echo "LICENSE is missing. Select and commit a license before publishing."
            exit 1
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            artifact: tpf2-mod-studio-linux-x64
          - name: Windows x64
            os: windows-2022
            artifact: tpf2-mod-studio-windows-x64

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf \
            xvfb \
            xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify TypeScript, tests and frontend build
        run: npm run verify

      - name: Check Rust formatting
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check

      - name: Run Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked --all-targets

      - name: Run Rust lints
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build native Tauri bundles
        run: npm run desktop:build

      - name: Upload verified native bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish v0.1.0-alpha.1
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download verified bundles
        uses: actions/download-artifact@v5
        with:
          pattern: tpf2-mod-studio-*-x64
          path: release-assets

      - name: Verify package set and create checksums
        shell: bash
        run: |
          for pattern in "*.msi" "*.exe" "*.AppImage" "*.deb" "*.rpm"; do
            if ! find release-assets -type f -name "$pattern" -print -quit | grep -q .; then
              echo "Required release package is missing: $pattern"
              exit 1
            fi
          done
          : > release-assets/SHA256SUMS.txt
          while IFS= read -r -d '' package; do
            checksum="$(sha256sum "$package" | cut -d ' ' -f 1)"
            printf '%s  %s\n' \
              "$checksum" \
              "$(basename "$package")" \
              >> release-assets/SHA256SUMS.txt
          done < <(
            find release-assets -type f ! -name SHA256SUMS.txt -print0 | sort -z
          )
          cat release-assets/SHA256SUMS.txt

      - name: Create immutable Public Alpha pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.0-alpha.1
          RELEASE_TITLE: Tpf2 Mod Studio 0.1.0 Public Alpha 1
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to replace it."
            exit 1
          fi
          mapfile -d '' assets < <(
            find release-assets -type f ! -name SHA256SUMS.txt -print0
          )
          gh release create "$RELEASE_TAG" \
            "${assets[@]}" \
            release-assets/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file docs/release-notes-0.1.0-alpha.1.md \
            --prerelease
