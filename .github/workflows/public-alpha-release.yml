name: Public Alpha Release

on:
  push:
    branches:
      - main
    paths:
      - "LICENSE"
      - ".github/workflows/public-alpha-release.yml"
      - "docs/release-notes-0.1.0-alpha.2.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-alpha-v0.1.0-alpha.2
  cancel-in-progress: false

jobs:
  release:
    name: Publish verified CI artifacts
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_TAG: v0.1.0-alpha.2
      RELEASE_TITLE: Tpf2 Mod Studio 0.1.0 Public Alpha 2
      SOURCE_RUN_ID: "30492768862"
      SOURCE_COMMIT: 28c0eca3a8e530190e55b225f002a1c3cd9cc5a8
      LINUX_ARTIFACT_ID: "8740463287"
      LINUX_ARCHIVE_SHA256: a1e4c04e36b41f56c2a531129a0d6e9eca6bf8e7c1e659eea5743ecd04582af1
      WINDOWS_ARTIFACT_ID: "8740475786"
      WINDOWS_ARCHIVE_SHA256: ce9db9fbec0e97bb381cf314563825305b30023cfc689932187ab6e9c277bec8

    steps:
      - name: Check out release metadata
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Require approved GPL-3.0-only license
        shell: bash
        run: |
          if [ ! -s LICENSE ]; then
            echo "LICENSE is missing."
            exit 1
          fi
          grep -q "GNU GENERAL PUBLIC LICENSE" LICENSE
          grep -q "Version 3, 29 June 2007" LICENSE
          grep -q '"license": "GPL-3.0-only"' package.json

      - name: Reuse an existing completed release
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $RELEASE_TAG already exists; no replacement is required."
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure existing release checksum names match downloads
        if: steps.existing.outputs.release_exists == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          checksum_dir="$RUNNER_TEMP/existing-release-checksums"
          mkdir -p "$checksum_dir"
          gh release download "$RELEASE_TAG" \
            --pattern SHA256SUMS.txt \
            --dir "$checksum_dir"
          checksum_file="$checksum_dir/SHA256SUMS.txt"
          if grep -Fq "  Tpf2 Mod Studio" "$checksum_file"; then
            sed 's/  Tpf2 Mod Studio/  Tpf2.Mod.Studio/g' \
              "$checksum_file" \
              > "$checksum_dir/SHA256SUMS.corrected.txt"
            mv "$checksum_dir/SHA256SUMS.corrected.txt" "$checksum_file"
            gh release upload "$RELEASE_TAG" "$checksum_file" --clobber
          fi
          test "$(wc -l < "$checksum_file")" -eq 5
          if grep -Fq "  Tpf2 Mod Studio" "$checksum_file"; then
            echo "Checksum names do not match the published download names."
            exit 1
          fi

      - name: Remove incomplete draft releases from failed attempts
        if: steps.existing.outputs.release_exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS= read -r release_id; do
            [ -n "$release_id" ] || continue
            echo "Removing incomplete draft release $release_id for $RELEASE_TAG."
            gh api \
              --method DELETE \
              "/repos/$GITHUB_REPOSITORY/releases/$release_id"
          done < <(
            gh api \
              --paginate \
              "/repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq ".[] | select(.draft == true and .tag_name == \"$RELEASE_TAG\") | .id"
          )

      - name: Download verified CI artifact archives
        if: steps.existing.outputs.release_exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets/linux release-assets/windows
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$LINUX_ARTIFACT_ID/zip" \
            > "$RUNNER_TEMP/linux-artifact.zip"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$WINDOWS_ARTIFACT_ID/zip" \
            > "$RUNNER_TEMP/windows-artifact.zip"

      - name: Verify artifact provenance and unpack packages
        if: steps.existing.outputs.release_exists != 'true'
        shell: bash
        run: |
          printf '%s  %s\n' \
            "$LINUX_ARCHIVE_SHA256" \
            "$RUNNER_TEMP/linux-artifact.zip" \
            | sha256sum -c -
          printf '%s  %s\n' \
            "$WINDOWS_ARCHIVE_SHA256" \
            "$RUNNER_TEMP/windows-artifact.zip" \
            | sha256sum -c -
          unzip -q "$RUNNER_TEMP/linux-artifact.zip" -d release-assets/linux
          unzip -q "$RUNNER_TEMP/windows-artifact.zip" -d release-assets/windows

      - name: Stage the five distributable packages
        if: steps.existing.outputs.release_exists != 'true'
        shell: bash
        run: |
          mkdir -p release-packages
          for pattern in "*.msi" "*.exe" "*.AppImage" "*.deb" "*.rpm"; do
            mapfile -d '' matches < <(
              find release-assets -type f -name "$pattern" -print0
            )
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected exactly one release package matching $pattern; found ${#matches[@]}."
              exit 1
            fi
            source_name="$(basename "${matches[0]}")"
            package_name="${source_name// /.}"
            if [ -e "release-packages/$package_name" ]; then
              echo "Duplicate release asset name: $package_name"
              exit 1
            fi
            cp "${matches[0]}" "release-packages/$package_name"
          done

      - name: Create package checksums
        if: steps.existing.outputs.release_exists != 'true'
        shell: bash
        working-directory: release-packages
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' \
            > SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 5
          sha256sum -c SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create immutable Public Alpha pre-release
        if: steps.existing.outputs.release_exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(
            find release-packages \
              -maxdepth 1 \
              -type f \
              ! -name SHA256SUMS.txt \
              -print0 \
              | sort -z
          )
          test "${#assets[@]}" -eq 5
          gh release create "$RELEASE_TAG" \
            "${assets[@]}" \
            release-packages/SHA256SUMS.txt \
            --target "$SOURCE_COMMIT" \
            --title "$RELEASE_TITLE" \
            --notes-file docs/release-notes-0.1.0-alpha.2.md \
            --prerelease

      - name: Record release provenance
        shell: bash
        run: |
          echo "Release: $RELEASE_TAG"
          echo "Verified source run: $SOURCE_RUN_ID"
          echo "Verified source commit: $SOURCE_COMMIT"
