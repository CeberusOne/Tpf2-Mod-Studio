name: Apply Windows detection fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-windows-detection-patch
  cancel-in-progress: true

jobs:
  patch-and-verify:
    if: github.head_ref == 'agent/windows-mod-source-detection-alpha11'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/windows-mod-source-detection-alpha11
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf \
            xvfb \
            xdg-utils

      - name: Apply repository patch
        run: python tools/agent_apply_windows_fix.py

      - name: Normalize generated Rust source
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path("apps/desktop/src-tauri/src/library.rs"),
              Path("apps/desktop/src-tauri/src/steam.rs"),
          ]
          bad = "replace('" + "\\" + "', \"/\")"
          good = "replace('" + "\\\\" + "', \"/\")"
          for path in paths:
              content = path.read_text(encoding="utf-8")
              content = content.replace(bad, good)
              if path.name == "library.rs":
                  lines = content.splitlines()
                  for index, line in enumerate(lines):
                      if 'format!("function data()' in line:
                          indent = line[: len(line) - len(line.lstrip())]
                          lines[index] = indent + r'format!("function data() return {{ info = {{ name = \"{id}\" }} }} end"),'
                  content = "\n".join(lines) + "\n"
              path.write_text(content, encoding="utf-8")
              print(f"Normalized {path}")

          lib_path = Path("apps/desktop/src-tauri/src/lib.rs")
          lib_content = lib_path.read_text(encoding="utf-8")
          if "    env,\n" not in lib_content:
              lib_content = lib_content.replace(
                  "    collections::HashSet,\n",
                  "    collections::HashSet,\n    env,\n",
                  1,
              )
          lib_path.write_text(lib_content, encoding="utf-8")
          print(f"Preserved std::env import in {lib_path}")
          PY

      - name: Format Rust
        working-directory: apps/desktop/src-tauri
        run: cargo fmt

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify TypeScript, tests and frontend build
        run: npm run verify

      - name: Run Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked --all-targets

      - name: Run Rust lints
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Commit verified patch
        run: |
          rm -f tools/agent_apply_windows_fix.py .github/workflows/agent-apply-windows-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete Windows TF2 and mod source discovery"
          git push origin HEAD:agent/windows-mod-source-detection-alpha11
