name: Apply preset library split

on:
  push:
    branches:
      - feature/savegame-preset-dnd-alpha13
    paths:
      - .github/preset-library-split-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: feature/savegame-preset-dnd-alpha13
          fetch-depth: 0

      - name: Apply integration patch
        run: python3 scripts/apply_preset_library_split.py

      - name: Remove one-shot files
        run: |
          rm -f scripts/apply_preset_library_split.py
          rm -f .github/preset-library-split-trigger
          rm -f .github/workflows/apply-preset-library-split.yml

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript, tests and frontend build
        run: npm run verify

      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate preset builder into mod library"
          git push origin HEAD:feature/savegame-preset-dnd-alpha13
