name: Apply preset ref preservation

on:
  push:
    branches:
      - feature/savegame-preset-dnd-alpha13
    paths:
      - .github/preset-ref-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: feature/savegame-preset-dnd-alpha13
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/apply_preset_ref_preservation.py

      - name: Remove one-shot files
        run: |
          rm -f scripts/apply_preset_ref_preservation.py
          rm -f .github/preset-ref-trigger
          rm -f .github/workflows/apply-preset-ref-preservation.yml

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify frontend and core
        run: npm run verify

      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve preset references and priority order"
          git push origin HEAD:feature/savegame-preset-dnd-alpha13
