version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      frontend-runtime:
        patterns:
          - react
          - react-dom
          - vite
          - "@vitejs/*"
          - "@tauri-apps/api"
          - "@tauri-apps/plugin-*"
      development-tooling:
        dependency-type: development
        patterns:
          - "*"
    labels:
      - dependencies

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "05:20"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns:
          - tauri
          - tauri-build
          - "tauri-plugin-*"
      rust-runtime:
        patterns:
          - tokio
          - reqwest
          - serde
          - serde_json
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "05:40"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - dependencies
