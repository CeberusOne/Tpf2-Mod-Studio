[package]
name = "tpf2-mod-studio"
version = "0.1.0-alpha.10"
description = "Standalone Transport Fever 2 mod development workbench"
authors = ["Mike Hering"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tpf2_mod_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.23.0"
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png", "tga"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
semver = "1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "rt-multi-thread"] }
zip = { version = "2", features = ["deflate"] }
zstd = "0.13.3"
