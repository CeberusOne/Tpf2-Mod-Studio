[package]
name = "tpf2-mod-studio"
version = "0.1.0"
description = "Standalone Transport Fever 2 mod development workbench"
authors = ["Tpf2 Mod Studio contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tpf2_mod_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
